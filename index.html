    const ppl=[];
    function addP(x,z,ci,stationary=false){const g=new THREE.Group();const cols=[0x3B4C9B,0x6C5CE7,0xA5ADD1,0xE8943A,0xD4AF37,0x555577,0x445588,0x884455];
      const body=new THREE.Mesh(new THREE.CapsuleGeometry(0.13,0.5,4,8),new THREE.MeshStandardMaterial({color:cols[ci%8],roughness:0.6}));body.position.y=0.5;body.castShadow=true;g.add(body);
      const head=new THREE.Mesh(new THREE.SphereGeometry(0.1,8,8),new THREE.MeshStandardMaterial({color:0xeeddcc,roughness:0.5}));head.position.y=1.0;head.castShadow=true;g.add(head);
      g.position.set(x,0,z);scene.add(g);
      ppl.push({g,sp:stationary?0:0.2+Math.random()*0.4,rad:stationary?0:0.6+Math.random()*1.8,off:Math.random()*Math.PI*2,sx:x,sz:z})}
    // Walking people (spread across bigger exhibition)
    for(let i=0;i<10;i++)addP(-14+Math.random()*12,-8+Math.random()*10,i);
    for(let i=0;i<5;i++)addP(-0.5+Math.random()*4,-4+Math.random()*12,i+2);
    for(let i=0;i<4;i++)addP(6+Math.random()*4,-6+Math.random()*4.5,i+4);
    for(let i=0;i<2;i++)addP(-4+Math.random()*2,5+Math.random()*1.5,i+3);
    // Stationary people at partner booths
    addP(-8.5,-6.5,0,true);addP(-5,-6.5,1,true);addP(-13.5,-3,2,true);addP(-13.5,0,3,true);
    addP(-7.5,-3.5,4,true);addP(-7.5,0.5,5,true);
    // Sitting at networking tables
    addP(-13.8,-1.2,6,true);addP(-13.2,0.5,7,true);addP(-13.5,1.8,0,true);

    // ===== DRONES =====
    const drones=[];
    [{r:14,h:8,s:0.3,hb:1.5,lc:0xff0000},{r:10,h:10,s:-0.45,hb:1,lc:0x00ff44},{r:18,h:6,s:0.2,hb:2,lc:0x3388ff}].forEach((cfg,di)=>{
      const g=new THREE.Group();g.add(new THREE.Mesh(new THREE.BoxGeometry(0.4,0.15,0.4),new THREE.MeshStandardMaterial({color:0x333344,roughness:0.3,metalness:0.5})));
      for(let i=0;i<4;i++){const arm=new THREE.Mesh(new THREE.BoxGeometry(0.6,0.04,0.06),new THREE.MeshStandardMaterial({color:0x444455}));arm.rotation.y=i*Math.PI/2;arm.position.x=Math.cos(i*Math.PI/2)*0.3;arm.position.z=Math.sin(i*Math.PI/2)*0.3;g.add(arm)}
      const led=new THREE.Mesh(new THREE.SphereGeometry(0.04,6,6),new THREE.MeshStandardMaterial({color:cfg.lc,emissive:cfg.lc,emissiveIntensity:1}));led.position.y=-0.08;g.add(led);
      g.position.y=cfg.h;scene.add(g);drones.push({group:g,led,offset:di*Math.PI*2/3,...cfg})});

    // Particles
    const PC=600,pGeo=new THREE.BufferGeometry(),pPos=new Float32Array(PC*3),pCol=new Float32Array(PC*3);
    const pcols=[new THREE.Color(0x3B4C9B),new THREE.Color(0xA5ADD1),new THREE.Color(0x6C5CE7)];
    for(let i=0;i<PC;i++){pPos[i*3]=(Math.random()-0.5)*55;pPos[i*3+1]=Math.random()*16;pPos[i*3+2]=(Math.random()-0.5)*55;const c=pcols[~~(Math.random()*3)];pCol[i*3]=c.r;pCol[i*3+1]=c.g;pCol[i*3+2]=c.b}
    pGeo.setAttribute('position',new THREE.BufferAttribute(pPos,3));pGeo.setAttribute('color',new THREE.BufferAttribute(pCol,3));
    const particles=new THREE.Points(pGeo,new THREE.PointsMaterial({size:0.06,transparent:true,opacity:0.3,blending:THREE.AdditiveBlending,sizeAttenuation:true,vertexColors:true}));scene.add(particles);

    // Rings
    const rings=[];
    Object.values(ZD).forEach((d,i)=>{[{r1:1.2,r2:1.35,s:1},{r1:0.5,r2:0.6,s:0.8}].forEach((cfg,j)=>{const rm=new THREE.MeshBasicMaterial({color:d.color,transparent:true,opacity:0.2,side:THREE.DoubleSide,blending:THREE.AdditiveBlending});const ring=new THREE.Mesh(new THREE.RingGeometry(cfg.r1,cfg.r2,32),rm);ring.rotation.x=-Math.PI/2;ring.position.set(d.cT.x,0.04,d.cT.z);scene.add(ring);rings.push({mesh:ring,mat:rm,base:cfg.s,off:j*Math.PI+i*0.5})})});

    // ===== AMBIENT SOUND =====
    let audioCtx=null,noiseNode=null,noiseGain=null,soundOn=false;
    function initSound(){if(audioCtx)return;audioCtx=new(window.AudioContext||window.webkitAudioContext)();
      const bufSize=2*audioCtx.sampleRate,buf=audioCtx.createBuffer(1,bufSize,audioCtx.sampleRate),data=buf.getChannelData(0);
      for(let i=0;i<bufSize;i++)data[i]=(Math.random()*2-1)*0.015;
      noiseNode=audioCtx.createBufferSource();noiseNode.buffer=buf;noiseNode.loop=true;
      noiseGain=audioCtx.createGain();noiseGain.gain.value=0;
      const filt=audioCtx.createBiquadFilter();filt.type='lowpass';filt.frequency.value=800;
      noiseNode.connect(filt);filt.connect(noiseGain);noiseGain.connect(audioCtx.destination);noiseNode.start()}
    function toggleSound(){if(!audioCtx)initSound();soundOn=!soundOn;
      document.getElementById('sndBtn').textContent=soundOn?'🔊':'🔇';
      if(soundOn&&noiseGain)noiseGain.gain.setTargetAtTime(0.3,audioCtx.currentTime,0.5);
      else if(noiseGain)noiseGain.gain.setTargetAtTime(0,audioCtx.currentTime,0.3)}

    // ===== CONFETTI =====
    const confCv=document.getElementById('confetti');confCv.width=innerWidth;confCv.height=innerHeight;const confCtx=confCv.getContext('2d');let confParts=[];
    function spawnConf(c){for(let i=0;i<60;i++)confParts.push({x:innerWidth/2+(Math.random()-0.5)*200,y:innerHeight/2,vx:(Math.random()-0.5)*10,vy:-Math.random()*10-3,w:Math.random()*7+2,h:Math.random()*3+2,color:c||`hsl(${Math.random()*360},70%,55%)`,life:100+Math.random()*50,rot:Math.random()*Math.PI*2,rv:Math.random()*0.3-0.15})}

    // ===== UI =====
    const navC=document.getElementById('zn');
    Object.entries(ZD).forEach(([k,d])=>{const b=document.createElement('button');b.className='zb';b.style.setProperty('--c',d.hex);b.innerHTML=`<span class="dt" style="background:${d.hex};box-shadow:0 0 6px ${d.hex}"></span>${d.title}`;b.onclick=()=>selZ(k);b.dataset.z=k;navC.appendChild(b)});
    document.querySelectorAll('.tb').forEach(btn=>{btn.onclick=()=>{document.querySelectorAll('.tb').forEach(b=>b.classList.remove('active'));btn.classList.add('active');const t=btn.dataset.tab,cam=tCams[t];if(cam){hideP();hideBP();aCam(cam.p,cam.t);if(t==='exhibition')setTimeout(()=>selZ('exhibition'),900)}}});

    const ray=new THREE.Raycaster(),mouse=new THREE.Vector2();
    const hl=document.getElementById('hl'),hd=document.getElementById('hd'),htEl=document.getElementById('ht'),hsEl=document.getElementById('hls');
    const pn=document.getElementById('pn'),rb=document.getElementById('rb'),bp=document.getElementById('bp');
    let hov=null,sel=null,animF=false,idleTime=0,fpvMode=false;

    function glow(z,on){CL.forEach(o=>{if(o.userData.zoneName===z&&OM.has(o)){if(on){const c=OM.get(o).clone();c.emissive=new THREE.Color(OM.get(o).color);c.emissiveIntensity=0.25;o.material=c}else o.material=OM.get(o)}})}

    window.addEventListener('mousemove',e=>{mouse.x=(e.clientX/innerWidth)*2-1;mouse.y=-(e.clientY/innerHeight)*2+1;hl.style.left=(e.clientX+16)+'px';hl.style.top=(e.clientY-26)+'px';idleTime=0});
    window.addEventListener('mousedown',()=>{idleTime=0});window.addEventListener('wheel',()=>{idleTime=0});

    renderer.domElement.addEventListener('click',()=>{
      if(animF)return;ray.setFromCamera(mouse,camera);const hits=ray.intersectObjects(CL);
      if(hits.length){const obj=hits[0].object;
        // Check booth first
        if(obj.userData.boothId&&BD[obj.userData.boothId]){showBP(obj.userData.boothId);return}
        // Then zone
        if(obj.userData.zoneName&&ZD[obj.userData.zoneName])selZ(obj.userData.zoneName)}});

    function selZ(n){if(animF)return;const d=ZD[n];if(!d)return;if(sel&&sel!==n)glow(sel,false);sel=n;glow(n,true);hideBP();
      document.querySelectorAll('.zb').forEach(b=>b.classList.toggle('active',b.dataset.z===n));
      showP(d);aCam(d.cP,d.cT);rb.classList.add('visible');idleTime=0;spawnConf(d.hex)}

    function showP(d){pn.style.setProperty('--glow-color',d.hex+'44');
      document.getElementById('pb').style.background=`linear-gradient(135deg,${d.hex},${d.hex}88)`;document.getElementById('pb').textContent=d.icon;
      document.getElementById('pt').textContent=d.title;document.getElementById('ps').textContent=d.sub;document.getElementById('pd').textContent=d.desc;
      const vcEl=document.getElementById('pvc');let vc=0;const tgt=d.visitors||0;const vi=setInterval(()=>{vc+=Math.ceil((tgt-vc)*0.15);if(vc>=tgt){vc=tgt;clearInterval(vi)}vcEl.textContent=vc},30);
      document.getElementById('pss').innerHTML=d.stats.map(([l,v])=>`<div class="st"><div class="sl">${l}</div><div class="sv">${v}</div></div>`).join('');
      const bf=document.getElementById('pbf');bf.style.width='0%';bf.style.background=`linear-gradient(90deg,${d.hex},${d.hex}88)`;
      const pcv=document.getElementById('pcv');let ov=0;const oi=setInterval(()=>{ov+=Math.ceil((d.occ-ov)*0.1);if(ov>=d.occ){ov=d.occ;clearInterval(oi)}pcv.textContent=ov+'%'},25);
      setTimeout(()=>bf.style.width=d.occ+'%',80);
      const cta=document.getElementById('pcta');cta.textContent=d.cta;cta.href=d.ctaLink;cta.style.background=`linear-gradient(135deg,${d.hex},${d.hex}cc)`;
      pn.classList.add('visible')}

    function hideP(){pn.classList.remove('visible');document.querySelectorAll('.zb').forEach(b=>b.classList.remove('active'));if(sel){glow(sel,false);sel=null}}

    // Booth popup
    function showBP(id){const b=BD[id];if(!b)return;hideBP();hideP();
      document.getElementById('bpBadge').textContent=b.label;document.getElementById('bpBadge').style.background=`linear-gradient(135deg,${b.hex},${b.hex}88)`;
      document.getElementById('bpTitle').textContent='Booth '+b.label;document.getElementById('bpType').textContent=b.type+' — '+b.size;
      document.getElementById('bpCompany').textContent=b.company;document.getElementById('bpDesc').textContent=b.desc;
      const st=document.getElementById('bpStatus');st.className='bp-status '+b.status;
      document.getElementById('bpSDot').style.background=b.status==='available'?'#4ade80':b.status==='reserved'?'#fbbf24':'#ef4444';
      document.getElementById('bpSText').textContent=b.status==='available'?'Available for booking':b.status==='reserved'?'Reserved — Contact us':'Sold';
      const cta=document.getElementById('bpCta');
      cta.textContent=b.status==='available'?'Reserve This Booth':b.status==='reserved'?'Contact About This Booth':'View Exhibitor';
      cta.style.background=b.status==='available'?'linear-gradient(135deg,#4ade80,#22c55e)':b.status==='reserved'?'linear-gradient(135deg,#fbbf24,#f59e0b)':`linear-gradient(135deg,${b.hex},${b.hex}cc)`;
      cta.href='https://www.aicyprusexpo.com/partners/';
      // Fly to booth
      aCam({x:b.x+3,y:4,z:b.z+4},{x:b.x,y:1,z:b.z});
      bp.classList.add('visible');rb.classList.add('visible')}
    function hideBP(){bp.classList.remove('visible')}
    document.getElementById('bpClose').onclick=()=>{hideBP();resetC()};

    document.getElementById('xb').onclick=()=>{hideP();resetC()};rb.onclick=resetC;
    document.addEventListener('keydown',e=>{if(e.key==='Escape'){resetC();hideBP()}});

    function resetC(){aCam({x:16,y:18,z:20},{x:1,y:0,z:2});rb.classList.remove('visible');hideP();hideBP();
      document.querySelectorAll('.tb').forEach(b=>b.classList.toggle('active',b.dataset.tab==='3d'));if(fpvMode)toggleFPV()}

    const transOvl=document.getElementById('transOvl');
    function aCam(toP,toT){animF=true;transOvl.classList.add('active');setTimeout(()=>transOvl.classList.remove('active'),500);
      const sp=camera.position.clone(),st=ctrl.target.clone(),ep=new THREE.Vector3(toP.x,toP.y,toP.z),et=new THREE.Vector3(toT.x,toT.y,toT.z),dur=1400,t0=performance.now(),ease=t=>t<0.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
      (function step(now){const t=Math.min((now-t0)/dur,1),e=ease(t);camera.position.lerpVectors(sp,ep,e);ctrl.target.lerpVectors(st,et,e);ctrl.update();if(t<1)requestAnimationFrame(step);else animF=false})(t0)}

    setTimeout(()=>{aCam({x:16,y:18,z:20},{x:1,y:0,z:2});document.getElementById('ld').classList.add('hidden')},2200);

    // ===== SEARCH =====
    document.getElementById('searchInput').addEventListener('keydown',e=>{
      if(e.key==='Enter'){const q=e.target.value.trim().toUpperCase();
        if(BD[q]){showBP(q);e.target.blur()}
        else if(ZD[q.toLowerCase()]){selZ(q.toLowerCase());e.target.blur()}}});

    // ===== FIRST PERSON VIEW =====
    const fpvInd=document.getElementById('fpvInd');
    function toggleFPV(){fpvMode=!fpvMode;document.getElementById('fpvBtn').classList.toggle('active',fpvMode);fpvInd.classList.toggle('active',fpvMode);
      if(fpvMode){hideP();hideBP();aCam({x:1.5,y:1.6,z:-5},{x:1.5,y:1.6,z:-3});ctrl.maxPolarAngle=Math.PI*0.85;ctrl.minDistance=0.5;ctrl.maxDistance=10}
      else{ctrl.maxPolarAngle=Math.PI/2.15;ctrl.minDistance=6;ctrl.maxDistance=55;resetC()}}
    document.getElementById('fpvBtn').onclick=toggleFPV;

    // ===== FULLSCREEN =====
    document.getElementById('fsBtn').onclick=()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen();else document.exitFullscreen()};

    // ===== SCREENSHOT =====
    document.getElementById('ssBtn').onclick=()=>{composer.render();const link=document.createElement('a');link.download='venue-3d-'+Date.now()+'.png';link.href=renderer.domElement.toDataURL('image/png');link.click()};

    // ===== SOUND =====
    document.getElementById('sndBtn').onclick=toggleSound;

    // ===== RENDER LOOP =====
    const clock=new THREE.Clock();
    (function render(){
      requestAnimationFrame(render);const t=clock.getElapsedTime(),dt=clock.getDelta();idleTime+=dt;

      if(idleTime>10&&!animF&&!sel&&!fpvMode){ctrl.autoRotate=true;ctrl.autoRotateSpeed=0.35}else ctrl.autoRotate=false;

      // Arrows
      arrows.forEach((a,i)=>{a.position.y=0.4+Math.sin(t*2.5+i*0.7)*0.18;a.material.emissiveIntensity=0.4+Math.sin(t*3+i)*0.25});
      // Rings
      rings.forEach(r=>{const ph=t*1.5+r.off;r.mesh.scale.setScalar(r.base+Math.sin(ph)*0.15);r.mat.opacity=0.12+Math.sin(ph)*0.08});
      // People
      ppl.forEach(p=>{if(p.rad>0){p.g.position.x=p.sx+Math.sin(t*p.sp+p.off)*p.rad;p.g.position.z=p.sz+Math.cos(t*p.sp*0.7+p.off)*p.rad*0.6;p.g.rotation.y=Math.atan2(Math.cos(t*p.sp+p.off)*p.rad,-Math.sin(t*p.sp*0.7+p.off)*p.rad*0.6)}});
      // Drones
      drones.forEach(d=>{const a=t*d.s+d.offset;d.group.position.x=Math.cos(a)*d.r;d.group.position.z=Math.sin(a)*d.r;d.group.position.y=d.h+Math.sin(t*0.8+d.offset)*d.hb;d.group.rotation.y=-a+Math.PI/2;d.led.material.emissiveIntensity=0.5+Math.sin(t*8+d.offset*2)*0.5});
      // Partner screens animate
      partnerScreens.forEach(s=>{s.mat.emissiveIntensity=0.35+Math.sin(t*2+s.idx*1.5)*0.2});
      // QR pulse
      qrMat.emissiveIntensity=0.25+Math.sin(t*2)*0.1;
      // Path dash animate
      pathMat.dashSize=0.5+Math.sin(t)*0.2;
      // Particles
      const pa=particles.geometry.attributes.position.array;for(let i=0;i<PC;i++){pa[i*3+1]+=Math.sin(t*0.25+i)*0.001;if(pa[i*3+1]>16)pa[i*3+1]=0}particles.geometry.attributes.position.needsUpdate=true;particles.rotation.y=t*0.01;
      // Sound volume based on camera distance
      if(soundOn&&noiseGain){const dist=camera.position.length();const vol=Math.max(0,Math.min(0.5,1-dist/40));noiseGain.gain.setTargetAtTime(vol*0.4,audioCtx.currentTime,0.1)}
      // Confetti
      confCtx.clearRect(0,0,innerWidth,innerHeight);
      for(let i=confParts.length-1;i>=0;i--){const p=confParts[i];p.x+=p.vx;p.y+=p.vy;p.vy+=0.12;p.vx*=0.99;p.rot+=p.rv;p.life--;confCtx.save();confCtx.translate(p.x,p.y);confCtx.rotate(p.rot);confCtx.fillStyle=p.color;confCtx.globalAlpha=Math.min(1,p.life/25);confCtx.fillRect(-p.w/2,-p.h/2,p.w,p.h);confCtx.restore();if(p.life<=0)confParts.splice(i,1)}

      // Hover (booth-aware)
      ray.setFromCamera(mouse,camera);const hits=ray.intersectObjects(CL);
      if(hits.length){const obj=hits[0].object;const bid=obj.userData.boothId;const zn=obj.userData.zoneName;
        if(bid&&BD[bid]){const b=BD[bid];if(bid!==hov){hov=bid;hd.style.background=b.hex;htEl.textContent=b.label+' — '+b.company;hsEl.textContent=b.status==='available'?'Available':b.status;hl.classList.add('visible');renderer.domElement.style.cursor='pointer'}}
        else if(zn&&ZD[zn]){const d=ZD[zn];if(zn!==hov){if(hov&&typeof hov==='string'&&hov.length<4){}hov=zn;hd.style.background=d.hex;htEl.textContent=d.title;hsEl.textContent='— Click to explore';hl.classList.add('visible');renderer.domElement.style.cursor='pointer'}}
      }else{if(hov){hov=null;hl.classList.remove('visible');renderer.domElement.style.cursor='default'}}

      ctrl.update();composer.render()})();

    window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);composer.setSize(innerWidth,innerHeight);confCv.width=innerWidth;confCv.height=innerHeight});
  </script>
</body>
</html>
